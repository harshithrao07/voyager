JUDGE0_TELEMETRY_ENABLE=false
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ENABLE_COMMAND_LINE_ARGUMENTS=true
ENABLE_ADDITIONAL_FILES=true
ENABLE_CALLBACKS=true
USE_DOCS_AS_HOMEPAGE=true

REDIS_HOST=judge0-redis
REDIS_PASSWORD=judge0-redis-password

POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0-postgres-password

CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=8388608
MAX_PROCESSES_AND_OR_THREADS=120
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
# MUST stay true on a cgroup v2 host. false makes isolate use cgroup memory
# limiting (--cg-mem), which needs the cgroup v1 controller at
# /sys/fs/cgroup/memory/ (absent under cgroup v2) and breaks every sandbox.
# With true, the memory limit becomes RLIMIT_AS (virtual address space) per
# process. Runtimes like the JVM, Node/V8 and Go reserve multiple GB of virtual
# space at startup, so the memory limit must be large enough (~4 GB) for them to
# start. See MAX_MEMORY_LIMIT above and the app's default memory limit.
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
MAX_FILE_SIZE=1024
MAX_MAX_FILE_SIZE=4096
MAX_EXTRACT_SIZE=10240
ALLOW_ENABLE_NETWORK=true
ENABLE_NETWORK=false
