services:
  app:
    build:
      context: .
    ports:
      - "8081:8080"
    volumes:
      # Dedicated host directory exposed to the Filesystem MCP server.
      - ./mcp-files:/mcp-files:rw
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobscheduler
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      OLLAMA_OPENAI_BASE_URL: ${OLLAMA_OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_OPENAI_API_KEY: ${OLLAMA_OPENAI_API_KEY:-ollama}
      # Loaded from the ignored .env. Compose must not start with a shared fallback key.
      SCHEDULER_SECRETS_MASTER_KEY: ${SCHEDULER_SECRETS_MASTER_KEY:?Set SCHEDULER_SECRETS_MASTER_KEY in .env or the deployment secret store}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-http://judge0-server:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: ${JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT:-true}
      JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: ${JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT:-true}
      # Virtual address-space ceiling (RLIMIT_AS) per run. 4 GB lets JVM/Node/Go start.
      JUDGE0_DEFAULT_MEMORY_LIMIT_KB: ${JUDGE0_DEFAULT_MEMORY_LIMIT_KB:-4194304}
      SCHEDULER_WORKER_ID: worker-${HOSTNAME:-host}
      # LLM observability. The app reaches langfuse-web over the compose network; tracing is
      # failure-safe, so the app intentionally does NOT depend_on langfuse (boots even if it is down).
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-true}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-8e0021d104267d6987dfc1c5}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-c6e981f141ae18aa64420f80}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      judge0-server:
        condition: service_healthy
      judge0-worker:
        condition: service_healthy
    healthcheck:
      # Compose has already gated the app on its external dependencies above;
      # this probe confirms Spring has finished booting and can serve traffic.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      # Repo root, so the build can reach /docs for the Docs page.
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  demo-mcp:
    image: node:22-alpine
    profiles: ["demo-mcp"]
    working_dir: /app
    command: ["node", "/app/scripts/demo-mcp-servers.mjs"]
    environment:
      DEMO_MCP_PORT: 48765
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "48765:48765"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:48765/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    # pgvector image (Postgres 16 + the `vector` extension) backs the workflow-AI
    # resource-embedding catalog. Drop-in for postgres:16-alpine; db/embeddings.sql
    # runs `CREATE EXTENSION IF NOT EXISTS vector` at startup.
    image: pgvector/pgvector:pg16
    # Keep enough headroom for the app pool plus local admin connections.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: jobscheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the `vector` extension on first init so Hibernate can build the
      # resource_embeddings vector column before the schema SQL runs.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobscheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 36
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # Persist the TSDB so metric history survives container recreation. The image's
      # default command already points --storage.tsdb.path at /prometheus.
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3300:3000"
    environment:
      # The frontend links here at <host>:3300 (see ObservabilityPage). Anonymous admin
      # keeps the dev experience click-through, matching Langfuse's default-creds ethos;
      # override GRAFANA_* via .env / the deployment secret store for real use.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3300}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      # Land on the bundled Spring Boot dashboard instead of the empty Grafana home.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/voyager-spring-boot.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    # Uses the image's baked-in local-config.yaml (filesystem storage under /loki).
    # Kept internal-only: Grafana queries it at http://loki:3100 over the compose
    # network, so it is NOT published to the host (host 3100 belongs to Langfuse).
    # No healthcheck: the image is distroless (no shell/wget/curl), so a container
    # probe is impossible. Grafana's Loki datasource health probe is the real check,
    # and Alloy retries its pushes until Loki is accepting them.
    expose:
      - "3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only Docker socket: Alloy discovers containers and tails their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  judge0-server:
    image: judge0/judge0:latest
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    # Not published to the host: Judge0 stays private on the Docker network and is
    # reached only by the app service via http://judge0-server:2358.
    expose:
      - "2358"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2358/languages | grep -q '\"id\"'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    restart: unless-stopped

  judge0-worker:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    privileged: true
    environment:
      # Image default is 24. Simultaneously booting Resque workers on one host
      # race in prune_dead_workers and evict each other's registrations,
      # leaving /workers empty and the app's judge0 health indicator DOWN.
      # A single worker cannot race itself, and is plenty for local dev.
      COUNT: "1"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      judge0-server:
        condition: service_healthy
      judge0-db:
        condition: service_healthy
      # Resque registers its worker exactly once at boot; if Redis is not
      # accepting connections yet the registration is silently lost and
      # /workers stays empty (health indicator DOWN) even though jobs run.
      judge0-redis:
        condition: service_healthy
    healthcheck:
      # Judge0's /workers response is empty before the first queue receives a
      # submission, even though the Resque worker is ready and waiting.
      test: ["CMD-SHELL", "ps aux | grep -q '[r]esque-2.0.0:'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  judge0-db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    command:
      - bash
      - -c
      - docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"
    env_file: judge0.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- Langfuse (LLM observability) -----------------------------------------------------------
  # Self-hosted Langfuse v4 stack, adapted from the official docker-compose. All backing services
  # (postgres/redis/clickhouse/minio) are prefixed langfuse- and kept internal-only to avoid clashing
  # with Voyager's own postgres/redis and prometheus (9090); only the web UI is published, on 3100.
  # Voyager pushes one OTLP trace per AI turn to http://langfuse-web:3000/api/public/otel.
  # The secrets below are DEV-ONLY; override via .env / the deployment secret store for real use.
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4
    restart: always
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      DATABASE_URL: postgresql://postgres:postgres@langfuse-postgres:5432/postgres
      SALT: "O8VKILOhm1eFcIAc8D2rFOV4y5roltrM"
      ENCRYPTION_KEY: "6c7cf619d2f3b8832d5c2cad12f1ac844596b5d77f76795fce55a9f2b7239cd2"
      TELEMETRY_ENABLED: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "06bef84eb10f9769f8b02bf6"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "3c1dd26900449d767c69e786"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "3c1dd26900449d767c69e786"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: "8dbe5eee92eb921819d537da"
      REDIS_TLS_ENABLED: "false"

  langfuse-web:
    image: docker.io/langfuse/langfuse:4
    restart: always
    depends_on: *langfuse-depends-on
    ports:
      - "3100:3000"
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: "IgQl9XCO+RNtZqDtxVTmKD6ID0n6gO68"
      # Media upload (browser -> minio) is unused for OTLP tracing; point at the internal endpoint.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      # Headless bootstrap: auto-creates an org/project with fixed API keys so Voyager can be
      # configured up front and you can sign in without clicking through onboarding.
      LANGFUSE_INIT_ORG_ID: voyager
      LANGFUSE_INIT_ORG_NAME: Voyager
      LANGFUSE_INIT_PROJECT_ID: voyager-ai
      LANGFUSE_INIT_PROJECT_NAME: Voyager AI
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-8e0021d104267d6987dfc1c5
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-c6e981f141ae18aa64420f80
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@voyager.local}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-voyager-admin}

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "06bef84eb10f9769f8b02bf6"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: "3c1dd26900449d767c69e786"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  langfuse-redis:
    image: docker.io/redis:7
    restart: always
    command: >
      --requirepass 8dbe5eee92eb921819d537da
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "8dbe5eee92eb921819d537da", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-postgres:
    image: docker.io/postgres:17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  judge0-db-data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
