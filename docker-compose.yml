services:
  app:
    build:
      context: .
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobscheduler
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      OLLAMA_OPENAI_BASE_URL: ${OLLAMA_OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_OPENAI_API_KEY: ${OLLAMA_OPENAI_API_KEY:-ollama}
      # Loaded from the ignored .env. Compose must not start with a shared fallback key.
      SCHEDULER_SECRETS_MASTER_KEY: ${SCHEDULER_SECRETS_MASTER_KEY:?Set SCHEDULER_SECRETS_MASTER_KEY in .env or the deployment secret store}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-http://judge0-server:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: ${JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT:-true}
      JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: ${JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT:-true}
      # Virtual address-space ceiling (RLIMIT_AS) per run. 4 GB lets JVM/Node/Go start.
      JUDGE0_DEFAULT_MEMORY_LIMIT_KB: ${JUDGE0_DEFAULT_MEMORY_LIMIT_KB:-4194304}
      SCHEDULER_WORKER_ID: worker-${HOSTNAME:-host}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      judge0-server:
        condition: service_healthy
      judge0-worker:
        condition: service_healthy
    healthcheck:
      # Compose has already gated the app on its external dependencies above;
      # this probe confirms Spring has finished booting and can serve traffic.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      # Repo root, so the build can reach /docs for the Docs page.
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  demo-mcp:
    image: node:22-alpine
    profiles: ["demo-mcp"]
    working_dir: /app
    command: ["node", "/app/scripts/demo-mcp-servers.mjs"]
    environment:
      DEMO_MCP_PORT: 48765
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "48765:48765"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:48765/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    # Keep enough headroom for the app pool plus local admin connections.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: jobscheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobscheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 36
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  judge0-server:
    image: judge0/judge0:latest
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    # Not published to the host: Judge0 stays private on the Docker network and is
    # reached only by the app service via http://judge0-server:2358.
    expose:
      - "2358"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2358/languages | grep -q '\"id\"'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    restart: unless-stopped

  judge0-worker:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    privileged: true
    environment:
      # Image default is 24. Simultaneously booting Resque workers on one host
      # race in prune_dead_workers and evict each other's registrations,
      # leaving /workers empty and the app's judge0 health indicator DOWN.
      # A single worker cannot race itself, and is plenty for local dev.
      COUNT: "1"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      judge0-server:
        condition: service_healthy
      judge0-db:
        condition: service_healthy
      # Resque registers its worker exactly once at boot; if Redis is not
      # accepting connections yet the registration is silently lost and
      # /workers stays empty (health indicator DOWN) even though jobs run.
      judge0-redis:
        condition: service_healthy
    healthcheck:
      # Judge0's /workers response is empty before the first queue receives a
      # submission, even though the Resque worker is ready and waiting.
      test: ["CMD-SHELL", "ps aux | grep -q '[r]esque-2.0.0:'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  judge0-db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    command:
      - bash
      - -c
      - docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"
    env_file: judge0.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  judge0-db-data:
