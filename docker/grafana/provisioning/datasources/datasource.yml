# Auto-provisioned on Grafana startup. The uid is fixed so the bundled dashboard
# (docker/grafana/dashboards) can reference this datasource without a manual link step.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    # Reached over the compose network; Prometheus scrapes the app at app:8080.
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    # Loki stays internal (not published to the host to avoid the 3100 clash with
    # Langfuse); Grafana reaches it over the compose network. Alloy pushes here.
    url: http://loki:3100
    editable: false
