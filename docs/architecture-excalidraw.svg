<svg width="1440" height="1040" viewBox="0 0 1440 1040" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Voyager architecture</title>
  <desc id="desc">Three-layer architecture diagram showing Voyager product capabilities, the integrated durable workflow runtime, and infrastructure plus external integrations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#334155" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#172033;text-anchor:middle}
      .subtitle{font:400 16px Inter,Arial,sans-serif;fill:#526076;text-anchor:middle}
      .layer{font:700 15px Inter,Arial,sans-serif;letter-spacing:1.6px;fill:#273449}
      .layerNote{font:400 13px Inter,Arial,sans-serif;fill:#64748b}
      .h{font:700 16px Inter,Arial,sans-serif;fill:#172033;text-anchor:middle}
      .t{font:400 12.5px Inter,Arial,sans-serif;fill:#526076;text-anchor:middle}
      .tag{font:600 11px Inter,Arial,sans-serif;fill:#334155;text-anchor:middle}
      .line{stroke:#334155;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .soft{stroke:#64748b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .card{stroke:#334155;stroke-width:1.8;rx:13;filter:url(#shadow)}
    </style>
  </defs>

  <rect width="1440" height="1040" fill="#FBFCFE"/>
  <path d="M56 31C231 21 413 36 590 27C806 17 1004 37 1381 26" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
  <text x="720" y="66" class="title">Voyager</text>
  <text x="720" y="96" class="subtitle">One self-hosted platform: product experience, durable workflow engine, and connected runtimes</text>

  <!-- Layer 1: Voyager product -->
  <rect x="48" y="130" width="1344" height="248" rx="22" fill="#EEF6FF" stroke="#4C78A8" stroke-width="2.2" stroke-dasharray="10 6"/>
  <text x="76" y="163" class="layer">01 · VOYAGER PRODUCT LAYER</text>
  <text x="76" y="187" class="layerNote">What authors and operators use</text>

  <rect x="88" y="216" width="280" height="118" fill="#DDEEFF" class="card"/>
  <text x="228" y="249" class="h">Authoring workspace</text>
  <text x="228" y="275" class="t">Visual canvas · Monaco JSON</text>
  <text x="228" y="297" class="t">drafts · state tests · revisions</text>
  <rect x="176" y="311" width="104" height="18" rx="9" fill="#BFDDF8"/>
  <text x="228" y="324" class="tag">React UI</text>

  <rect x="416" y="216" width="280" height="118" fill="#E5E2FF" class="card"/>
  <text x="556" y="249" class="h">AI workflow design</text>
  <text x="556" y="275" class="t">persistent chat · tool grounding</text>
  <text x="556" y="297" class="t">validation · repair · solution reuse</text>
  <rect x="488" y="311" width="136" height="18" rx="9" fill="#CEC8FA"/>
  <text x="556" y="324" class="tag">Chat + embeddings</text>

  <rect x="744" y="216" width="280" height="118" fill="#E1F5EA" class="card"/>
  <text x="884" y="249" class="h">Resource ecosystem</text>
  <text x="884" y="275" class="t">system Tasks · versioned functions</text>
  <text x="884" y="297" class="t">MCP registry · live tool catalog</text>
  <rect x="820" y="311" width="128" height="18" rx="9" fill="#BFE5D0"/>
  <text x="884" y="324" class="tag">Exact Task URIs</text>

  <rect x="1072" y="216" width="280" height="118" fill="#FFF0D8" class="card"/>
  <text x="1212" y="249" class="h">Operations</text>
  <text x="1212" y="275" class="t">execution traces · cancellation</text>
  <text x="1212" y="297" class="t">model ranking · AI observability</text>
  <rect x="1157" y="311" width="110" height="18" rx="9" fill="#F6D9A9"/>
  <text x="1212" y="324" class="tag">Operate + compare</text>

  <!-- Product to core -->
  <path d="M228 334V405H405V449" class="line"/>
  <path d="M556 334V405H586V449" class="line"/>
  <path d="M884 334V405H854V449" class="line"/>
  <path d="M1212 334V405H1035V449" class="line"/>

  <!-- Layer 2: integrated app/core -->
  <rect x="48" y="424" width="1344" height="252" rx="22" fill="#F4F1FF" stroke="#7559B7" stroke-width="2.2" stroke-dasharray="10 6"/>
  <text x="76" y="457" class="layer">02 · INTEGRATED SPRING BOOT APPLICATION</text>
  <text x="76" y="481" class="layerNote">Voyager product services and its durable workflow runtime run together</text>

  <rect x="284" y="508" width="244" height="118" fill="#ECE8FF" class="card"/>
  <text x="406" y="541" class="h">API and services</text>
  <text x="406" y="567" class="t">REST · WebSocket · validation</text>
  <text x="406" y="589" class="t">catalog · secrets · revisions</text>

  <rect x="598" y="494" width="244" height="146" fill="#DDD5FF" class="card" stroke-width="2.5"/>
  <text x="720" y="530" class="h">Durable interpreter</text>
  <text x="720" y="556" class="t">ASL + JSONata · execution scopes</text>
  <text x="720" y="578" class="t">Parallel / Map · Retry / Catch</text>
  <text x="720" y="600" class="t">frontier-driven advancement</text>
  <rect x="654" y="614" width="132" height="18" rx="9" fill="#C8BCF7"/>
  <text x="720" y="627" class="tag">persisted execution</text>

  <rect x="912" y="508" width="244" height="118" fill="#ECE8FF" class="card"/>
  <text x="1034" y="541" class="h">Schedulers and workers</text>
  <text x="1034" y="567" class="t">cron · Wait · retries · watchdogs</text>
  <text x="1034" y="589" class="t">Task dispatch · recovery · DLQ</text>

  <path d="M528 567H590" class="line"/>
  <path d="M842 567H904" class="line"/>

  <!-- Core to foundation -->
  <path d="M406 626V720H226V767" class="line"/>
  <path d="M680 640V720H545V767" class="line"/>
  <path d="M760 640V720H879V767" class="line"/>
  <path d="M1034 626V720H1212V767" class="line"/>

  <!-- Layer 3: infra/integrations -->
  <rect x="48" y="704" width="1344" height="278" rx="22" fill="#F3F8F4" stroke="#4F8A64" stroke-width="2.2" stroke-dasharray="10 6"/>
  <text x="76" y="737" class="layer">03 · DURABLE INFRASTRUCTURE AND EXTERNAL RUNTIMES</text>
  <text x="76" y="761" class="layerNote">State, coordination, execution, AI, and telemetry remain replaceable integration boundaries</text>

  <rect x="88" y="792" width="276" height="132" fill="#E0F0E5" class="card"/>
  <text x="226" y="827" class="h">PostgreSQL + pgvector</text>
  <text x="226" y="853" class="t">definitions · executions · traces</text>
  <text x="226" y="875" class="t">row locks · encrypted credentials</text>
  <text x="226" y="897" class="t">embeddings · semantic cache</text>

  <rect x="408" y="792" width="276" height="132" fill="#E0F0E5" class="card"/>
  <text x="546" y="827" class="h">Kafka + Redis</text>
  <text x="546" y="853" class="t">Task and priority queues · DLQ</text>
  <text x="546" y="875" class="t">worker locks · idempotency</text>
  <text x="546" y="897" class="t">distributed coordination</text>

  <rect x="728" y="792" width="276" height="132" fill="#E0F0E5" class="card"/>
  <text x="866" y="827" class="h">Judge0 + MCP</text>
  <text x="866" y="853" class="t">sandboxed function execution</text>
  <text x="866" y="875" class="t">HTTP-family and STDIO servers</text>
  <text x="866" y="897" class="t">workflow Task side effects</text>

  <rect x="1048" y="792" width="304" height="132" fill="#E0F0E5" class="card"/>
  <text x="1200" y="827" class="h">Models + observability</text>
  <text x="1200" y="853" class="t">OpenAI-compatible endpoints</text>
  <text x="1200" y="875" class="t">Langfuse · Prometheus · Grafana</text>
  <text x="1200" y="897" class="t">Loki · Alloy · failure-safe telemetry</text>

  <path d="M88 961C293 975 509 955 720 966C927 977 1134 954 1352 966" stroke="#86A892" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
</svg>
