name: voyager-jenkins

services:
  jenkins:
    build:
      context: .jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true
    # Docker Desktop exposes the engine through this socket. Membership in its
    # owning group lets Jenkins use Docker without running the controller as root.
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Local CD reads the same ignored deployment env used by Voyager Compose.
      # The pipeline never prints or copies this file.
      - type: bind
        source: ${VOYAGER_DEPLOY_ENV_FILE:-./.env}
        target: /run/voyager-deploy/.env
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  jenkins-home:
