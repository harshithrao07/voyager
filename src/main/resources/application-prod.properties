spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

# MCP client bearer tokens. A registered MCP server stores only its authTokenRef
# (a name), never the secret. The deployment tier supplies the secret for each
# ref via one of the following, resolved at connect time:
#   inline:  env SCHEDULER_MCP_TOKENS_<REF>            (e.g. SCHEDULER_MCP_TOKENS_GITHUB_MCP_TOKEN)
#   file:    env SCHEDULER_MCP_TOKEN_FILES_<REF>       -> path to a mounted secret file,
#            read fresh on each connect so a rotated k8s/Docker secret needs no restart.
# Use an UPPER_SNAKE_CASE authTokenRef so it maps cleanly onto the env var name.
