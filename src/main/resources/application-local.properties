spring.datasource.url=jdbc:postgresql://localhost:5432/jobscheduler
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/workflow-ai-conversations.sql

spring.kafka.bootstrap-servers=localhost:9092

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Local-dev-only AES-256-GCM master key (like the postgres creds above, not a real
# secret). Override with env SCHEDULER_SECRETS_MASTER_KEY. Prod sets no default and
# fails fast unless the env var is provided.
scheduler.secrets.master-key=${SCHEDULER_SECRETS_MASTER_KEY:dm95YWdlci1sb2NhbC1kZXYtbWFzdGVyLWtleS0zMmI=}

# Local self-hosted AI through Ollama's OpenAI-compatible API.
langchain4j.open-ai.chat-model.base-url=${OLLAMA_OPENAI_BASE_URL:http://localhost:11434/v1}
langchain4j.open-ai.chat-model.api-key=${OLLAMA_OPENAI_API_KEY:ollama}
langchain4j.open-ai.chat-model.model-name=${OLLAMA_MODEL:qwen3:8b}
