spring.datasource.url=jdbc:postgresql://localhost:5432/jobscheduler
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=localhost:9092

spring.data.redis.host=localhost
spring.data.redis.port=6379

scheduler.storage.enabled=true
scheduler.storage.endpoint=${SCHEDULER_STORAGE_ENDPOINT:http://localhost:9000}
scheduler.storage.access-key=${SCHEDULER_STORAGE_ACCESS_KEY:minioadmin}
scheduler.storage.secret-key=${SCHEDULER_STORAGE_SECRET_KEY:minioadmin}
scheduler.storage.bucket=${SCHEDULER_STORAGE_BUCKET:scheduler-workflow-data}

# Local self-hosted AI through Ollama's OpenAI-compatible API.
langchain4j.open-ai.chat-model.base-url=${OLLAMA_OPENAI_BASE_URL:http://localhost:11434/v1}
langchain4j.open-ai.chat-model.api-key=${OLLAMA_OPENAI_API_KEY:ollama}
langchain4j.open-ai.chat-model.model-name=${OLLAMA_MODEL:qwen3:8b}
