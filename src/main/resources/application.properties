spring.application.name=scheduler
spring.profiles.default=local

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Pool sized for 12 worker listener threads + due-job scheduler + 2 watchdogs +
# DLQ scheduler + a few API request handlers. Default of 10 contends under load.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.UUIDSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.UUIDDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.job.scheduler.dto.WorkflowTaskDispatchEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.job.scheduler.dto,com.job.scheduler.enums
spring.kafka.consumer.auto-offset-reset=earliest

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.health.discovery.enabled=false
management.health.redis.enabled=true
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Distributed job scheduler
info.app.version=@project.version@

scheduler.worker-id=${SCHEDULER_WORKER_ID:worker-1}
scheduler.enabled=${SCHEDULER_ENABLED:true}
scheduler.redis-health.poll-delay-ms=5000
scheduler.kafka.redis-retry-backoff-ms=5000

scheduler.webhook.connect-timeout-ms=5000
scheduler.webhook.read-timeout-ms=10000

scheduler.judge0.base-url=${JUDGE0_BASE_URL:http://localhost:2358}
scheduler.judge0.auth-token=${JUDGE0_AUTH_TOKEN:}
scheduler.judge0.poll-interval-ms=500
scheduler.judge0.max-poll-duration-ms=60000
scheduler.judge0.default-cpu-time-limit-seconds=2.0
scheduler.judge0.default-wall-time-limit-seconds=10.0
# 4 GB by default so runtimes that reserve large virtual address space at startup
# (JVM, Node/V8, Go) can start under RLIMIT_AS. This is a virtual-memory ceiling,
# not physical RSS, so it is cheap for lightweight languages. Lower per version
# (Settings tab) or globally via JUDGE0_DEFAULT_MEMORY_LIMIT_KB if desired.
scheduler.judge0.default-memory-limit-kb=${JUDGE0_DEFAULT_MEMORY_LIMIT_KB:4194304}
scheduler.judge0.default-max-file-size-kb=1024
scheduler.judge0.default-max-output-bytes=65536
scheduler.judge0.enable-per-process-and-thread-time-limit=${JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT:true}
# Must stay true on a cgroup v2 host: false makes isolate use cgroup memory
# limiting, which needs the cgroup v1 controller (/sys/fs/cgroup/memory) that
# doesn't exist under cgroup v2, breaking every sandbox. See judge0.conf.
scheduler.judge0.enable-per-process-and-thread-memory-limit=${JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT:true}
# Comma-separated Judge0 language ids allowed for function versions/runs.
# Blank = all real Judge0 program runtimes with stdin/stdout support, excluding
# SQL-like query runtimes and Judge0 pseudo-runtimes such as Plain Text,
# Executable, and Multi-file program.
scheduler.judge0.allowed-language-ids=${JUDGE0_ALLOWED_LANGUAGE_IDS:}

scheduler.workflow.mapping-timeout-ms=100
scheduler.workflow.mapping-max-depth=100
scheduler.workflow.max-inline-transitions=10000
scheduler.workflow.schedule-poll-delay-ms=1000
scheduler.workflow.schedule-claim-limit=100
scheduler.workflow.start-poll-delay-ms=1000
scheduler.workflow.start-claim-limit=100
scheduler.workflow.start-claim-timeout-ms=60000
scheduler.workflow.scope-recovery-poll-delay-ms=1000
scheduler.workflow.scope-recovery-claim-limit=100
scheduler.workflow.scope-recovery-stale-timeout-ms=60000
scheduler.workflow.deadline-poll-delay-ms=1000
scheduler.workflow.deadline-claim-limit=100
scheduler.workflow.wait-poll-delay-ms=1000
scheduler.workflow.wait-claim-limit=100
scheduler.workflow.wait-claim-timeout-ms=60000
scheduler.workflow.wait-resume-retry-delay-ms=5000
scheduler.workflow.task-queued-timeout-ms=300000
scheduler.workflow.task-queued-watchdog-poll-delay-ms=60000
scheduler.workflow.task-queued-recovery-limit=100
scheduler.workflow.task-running-timeout-ms=600000
scheduler.workflow.task-running-watchdog-poll-delay-ms=60000
scheduler.workflow.task-heartbeat-max-pulse-ms=5000
scheduler.workflow.task-dispatch-poll-delay-ms=1000
scheduler.workflow.task-dispatch-claim-limit=100
scheduler.workflow.max-input-bytes=262144
scheduler.workflow.max-output-bytes=262144
scheduler.workflow.max-variables-bytes=262144
scheduler.workflow.max-task-arguments-bytes=262144
scheduler.workflow.max-task-result-bytes=262144
scheduler.workflow.max-error-details-bytes=32768
scheduler.storage.enabled=false

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# LangChain4j Cloudflare Workers AI Configuration
# Replace api-key and base-url account ID with your actual Cloudflare values
langchain4j.open-ai.chat-model.api-key=${CLOUDFLARE_API_KEY:your-cloudflare-api-key}
langchain4j.open-ai.chat-model.base-url=https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID:your-account-id}/ai/v1
langchain4j.open-ai.chat-model.model-name=@cf/meta/llama-3-8b-instruct
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true
