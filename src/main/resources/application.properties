spring.application.name=scheduler
spring.profiles.default=local

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Pool sized for 12 worker listener threads + due-job scheduler + 2 watchdogs +
# DLQ scheduler + a few API request handlers. Default of 10 contends under load.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.UUIDSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.UUIDDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.job.scheduler.dto.WorkflowTaskDispatchEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.job.scheduler.dto,com.job.scheduler.enums
spring.kafka.consumer.auto-offset-reset=earliest

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.health.discovery.enabled=false
management.health.redis.enabled=true
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Distributed job scheduler
info.app.version=@project.version@

scheduler.worker-id=${SCHEDULER_WORKER_ID:worker-1}
scheduler.enabled=${SCHEDULER_ENABLED:true}

# Master key for encrypting provider/MCP secrets at rest (AES-256-GCM). Supply a
# base64-encoded 32-byte key, e.g. `openssl rand -base64 32`. Required: the app
# fails fast at startup if this is missing or not 32 bytes.
scheduler.secrets.master-key=${SCHEDULER_SECRETS_MASTER_KEY:}
scheduler.redis-health.poll-delay-ms=5000
scheduler.kafka.redis-retry-backoff-ms=5000

scheduler.webhook.connect-timeout-ms=5000
scheduler.webhook.read-timeout-ms=10000

scheduler.judge0.base-url=${JUDGE0_BASE_URL:http://localhost:2358}
scheduler.judge0.auth-token=${JUDGE0_AUTH_TOKEN:}
scheduler.judge0.poll-interval-ms=500
scheduler.judge0.max-poll-duration-ms=60000
scheduler.judge0.default-cpu-time-limit-seconds=2.0
scheduler.judge0.default-wall-time-limit-seconds=10.0
# 4 GB by default so runtimes that reserve large virtual address space at startup
# (JVM, Node/V8, Go) can start under RLIMIT_AS. This is a virtual-memory ceiling,
# not physical RSS, so it is cheap for lightweight languages. Lower per version
# (Settings tab) or globally via JUDGE0_DEFAULT_MEMORY_LIMIT_KB if desired.
scheduler.judge0.default-memory-limit-kb=${JUDGE0_DEFAULT_MEMORY_LIMIT_KB:4194304}
scheduler.judge0.default-max-file-size-kb=1024
scheduler.judge0.default-max-output-bytes=65536
scheduler.judge0.enable-per-process-and-thread-time-limit=${JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT:true}
# Must stay true on a cgroup v2 host: false makes isolate use cgroup memory
# limiting, which needs the cgroup v1 controller (/sys/fs/cgroup/memory) that
# doesn't exist under cgroup v2, breaking every sandbox. See judge0.conf.
scheduler.judge0.enable-per-process-and-thread-memory-limit=${JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT:true}
# Comma-separated Judge0 language ids allowed for function versions/runs.
# Blank = all real Judge0 program runtimes with stdin/stdout support for
# single-file functions, excluding SQL-like query runtimes and Judge0
# pseudo-runtimes such as Plain Text, Executable, and Multi-file program.
# Multi-file functions are additionally limited to runtimes with a known
# Judge0 multi-file recipe.
scheduler.judge0.allowed-language-ids=${JUDGE0_ALLOWED_LANGUAGE_IDS:}
scheduler.judge0.ai-default-language-id=${JUDGE0_AI_DEFAULT_LANGUAGE_ID:71}

scheduler.workflow.mapping-timeout-ms=1000
scheduler.workflow.mapping-max-depth=100
scheduler.workflow.max-inline-transitions=10000
scheduler.workflow.schedule-poll-delay-ms=1000
scheduler.workflow.schedule-claim-limit=100
scheduler.workflow.start-poll-delay-ms=1000
scheduler.workflow.start-claim-limit=100
scheduler.workflow.start-claim-timeout-ms=60000
scheduler.workflow.scope-recovery-poll-delay-ms=1000
scheduler.workflow.scope-recovery-claim-limit=100
scheduler.workflow.scope-recovery-stale-timeout-ms=60000
scheduler.workflow.deadline-poll-delay-ms=1000
scheduler.workflow.deadline-claim-limit=100
scheduler.workflow.wait-poll-delay-ms=1000
scheduler.workflow.wait-claim-limit=100
scheduler.workflow.wait-claim-timeout-ms=60000
scheduler.workflow.wait-resume-retry-delay-ms=5000
scheduler.workflow.task-queued-timeout-ms=300000
scheduler.workflow.task-queued-watchdog-poll-delay-ms=60000
scheduler.workflow.task-queued-recovery-limit=100
scheduler.workflow.task-running-timeout-ms=600000
scheduler.workflow.task-running-watchdog-poll-delay-ms=60000
scheduler.workflow.task-heartbeat-max-pulse-ms=5000
scheduler.workflow.task-dispatch-poll-delay-ms=1000
scheduler.workflow.task-dispatch-claim-limit=100
scheduler.workflow.max-input-bytes=262144
scheduler.workflow.max-output-bytes=262144
scheduler.workflow.max-variables-bytes=262144
scheduler.workflow.max-task-arguments-bytes=262144
scheduler.workflow.max-task-result-bytes=262144
scheduler.workflow.max-error-details-bytes=32768
# Workflow-AI context compaction uses a conservative character-based token estimate so it works
# across all configured OpenAI-compatible local models without a model-specific tokenizer.
scheduler.workflow-ai.context.max-estimated-tokens=${WORKFLOW_AI_MAX_CONTEXT_TOKENS:12000}
scheduler.workflow-ai.context.recent-estimated-tokens=${WORKFLOW_AI_RECENT_CONTEXT_TOKENS:4000}
scheduler.workflow-ai.context.summary-max-characters=${WORKFLOW_AI_SUMMARY_MAX_CHARACTERS:6000}

# Embeddings / RAG catalog matching. When enabled, catalog resources (functions + MCP
# tools) are embedded with the default EMBEDDING-role model and the workflow prompt
# retrieves only the top-k nearest resources at full detail; the rest carry a one-line
# index. Retrieval is skipped (full detail for all) when the catalog has fewer than
# min-catalog-size entries, so small installs behave exactly as before. Dimensions must
# match the embedding model and the resource_embeddings vector column (nomic-embed-text
# = 768). Embedding failures never block catalog building or resource creation.
scheduler.workflow-ai.embedding.enabled=${WORKFLOW_AI_EMBEDDING_ENABLED:true}
scheduler.workflow-ai.embedding.dimensions=${WORKFLOW_AI_EMBEDDING_DIMENSIONS:768}
scheduler.workflow-ai.embedding.top-k=${WORKFLOW_AI_EMBEDDING_TOP_K:8}
scheduler.workflow-ai.embedding.min-catalog-size=${WORKFLOW_AI_EMBEDDING_MIN_CATALOG_SIZE:12}
scheduler.workflow-ai.embedding.reconcile-delay-ms=${WORKFLOW_AI_EMBEDDING_RECONCILE_DELAY_MS:900000}
scheduler.workflow-ai.embedding.reconcile-initial-delay-ms=${WORKFLOW_AI_EMBEDDING_RECONCILE_INITIAL_DELAY_MS:60000}
# Destructive history cleanup is opt-in. When enabled, each scheduler pass
# atomically removes one bounded batch of terminal execution trees older than
# the retention age. Active and recently completed executions are never
# candidates.
scheduler.workflow.retention.enabled=${WORKFLOW_RETENTION_ENABLED:false}
scheduler.workflow.retention-age-ms=${WORKFLOW_RETENTION_AGE_MS:2592000000}
scheduler.workflow.retention-batch-size=${WORKFLOW_RETENTION_BATCH_SIZE:100}
scheduler.workflow.retention-poll-delay-ms=${WORKFLOW_RETENTION_POLL_DELAY_MS:3600000}
scheduler.workflow.retention-initial-delay-ms=${WORKFLOW_RETENTION_INITIAL_DELAY_MS:60000}

# Background re-sync of each ENABLED MCP server's tool catalog. Runs on a fixed
# delay after an initial warm-up delay; manual .../tools/sync is unaffected.
scheduler.mcp.tool-sync-delay-ms=900000
scheduler.mcp.tool-sync-initial-delay-ms=60000
# Default MCP client timeouts (a server may override both with its request timeout).
# MCP SDK 2.x has a separate 20s initialization default; cold STDIO/npx launches
# need a larger explicit budget while the package is downloaded and started.
scheduler.mcp.request-timeout-ms=30000
scheduler.mcp.initialization-timeout-ms=60000
scheduler.mcp.sync-timeout-ms=90000

# Public MCP catalog used to recommend servers for AI-proposed capabilities. The
# bundled catalog ships in-repo and always works offline; the external registry is
# opt-in (self-hosted deployments may be air-gapped) and layers on top when enabled.
scheduler.mcp.registry.bundled-catalog=classpath:mcp/public-catalog.json
scheduler.mcp.registry.external.enabled=${MCP_REGISTRY_EXTERNAL_ENABLED:true}
scheduler.mcp.registry.external.url=${MCP_REGISTRY_EXTERNAL_URL:https://registry.modelcontextprotocol.io}
scheduler.mcp.registry.external.timeout-ms=${MCP_REGISTRY_EXTERNAL_TIMEOUT_MS:4000}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# LangChain4j Cloudflare Workers AI Configuration
# Replace api-key and base-url account ID with your actual Cloudflare values
langchain4j.open-ai.chat-model.api-key=${CLOUDFLARE_API_KEY:your-cloudflare-api-key}
langchain4j.open-ai.chat-model.base-url=https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID:your-account-id}/ai/v1
langchain4j.open-ai.chat-model.model-name=@cf/meta/llama-3-8b-instruct
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true
